name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: olydraw-macos-amd64.dmg
            binary_name: olydraw
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: olydraw-macos-arm64.dmg
            binary_name: olydraw
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: olydraw-windows-amd64.exe
            binary_name: olydraw.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: olydraw-windows-arm64.exe
            binary_name: olydraw.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: olydraw-linux-amd64
            binary_name: olydraw
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: olydraw-linux-arm64
            binary_name: olydraw
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libglib2.0-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package macOS app bundle as DMG
        if: runner.os == 'macOS'
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"

          app="olydraw.app"
          mkdir -p "$app/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$app/Contents/MacOS/olydraw"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist.template > "$app/Contents/Info.plist"

          dmg_root="dmg-root"
          mkdir -p "$dmg_root"
          cp -R "$app" "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"

          hdiutil create -volname olydraw -srcfolder "$dmg_root" -ov -format UDZO "${{ matrix.asset_name }}"
      - name: Rename binary
        if: runner.os != 'macOS'
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
