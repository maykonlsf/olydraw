[package]
name = "olydraw"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.6.1"
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.35.0"
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
interprocess = "2.4.2"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
tiny-skia = "0.12.0"
toml = "1.1.3"
tray-icon = "0.24.1"
xcap = "0.9.6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
raw-window-handle = "0.6.2"
